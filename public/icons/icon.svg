<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo gradiente oscuro profundo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14110a" />
      <stop offset="50%" stop-color="#110918" />
      <stop offset="100%" stop-color="#06070c" />
    </linearGradient>

    <!-- Borde Oro VIP -> Titanium -> Magenta -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#e024c3" stop-opacity="0.55" />
    </linearGradient>

    <!-- Aura izquierda Oro VIP -->
    <radialGradient id="auraLeft" cx="35%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Aura derecha Titanium + Magenta -->
    <radialGradient id="auraRight" cx="68%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#e024c3" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#cbd5e1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#e024c3" stop-opacity="0" />
    </radialGradient>

    <!-- Resplandor neón -->
    <filter id="neonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradientes del emblema (espacio 100x100 escalado) -->
    <clipPath id="clipL">
      <rect x="0" y="0" width="50" height="100" />
    </clipPath>
    <clipPath id="clipR">
      <rect x="50" y="0" width="50" height="100" />
    </clipPath>
    <linearGradient id="goldGrad" x1="10" y1="10" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="55%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="titGrad" x1="50" y1="10" x2="92" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="divGrad" x1="50" y1="0" x2="50" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ff6bf0" />
    </linearGradient>
  </defs>

  <!-- Fondo squircle premium -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="502" height="502" x="5" y="5" rx="110" fill="none" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Auras duales -->
  <circle cx="195" cy="256" r="200" fill="url(#auraLeft)" />
  <circle cx="320" cy="256" r="200" fill="url(#auraRight)" />

  <!-- Emblema CYNKO Oro VIP (QR + Nodos) + Vinilo Titanium con acento Magenta -->
  <g transform="translate(46, 46) scale(4.2)" filter="url(#neonGlow)">
    <!-- Mitad Izquierda: QR + Nodos Oro VIP -->
    <g clip-path="url(#clipL)">
      <circle cx="50" cy="50" r="42" stroke="url(#goldGrad)" stroke-width="4.2" fill="none" />
      <path d="M35 28.5 L42 35 L50 50 M27 50 L50 50 M35 71.5 L42 65 L50 50" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round" opacity="0.78" fill="none" />
      <rect x="22" y="22" width="12" height="12" rx="3" stroke="#fde047" stroke-width="2.6" fill="#07070c" />
      <rect x="26" y="26" width="4" height="4" rx="1" fill="#ffffff" />
      <rect x="15" y="44" width="12" height="12" rx="3" fill="#fbbf24" />
      <rect x="22" y="66" width="12" height="12" rx="3" stroke="#f59e0b" stroke-width="2.6" fill="#07070c" />
      <rect x="26" y="70" width="4" height="4" rx="1" fill="#f59e0b" />
    </g>

    <!-- Mitad Derecha: Vinilo Titanium -->
    <g clip-path="url(#clipR)">
      <circle cx="50" cy="50" r="42" stroke="url(#titGrad)" stroke-width="4.2" fill="none" />
      <circle cx="50" cy="50" r="32" stroke="#e2e8f0" stroke-width="2.3" opacity="0.9" fill="none" />
      <circle cx="50" cy="50" r="22.5" stroke="#cbd5e1" stroke-width="2.3" opacity="0.92" fill="none" />
      <circle cx="50" cy="50" r="13.5" stroke="#94a3b8" stroke-width="2" opacity="0.85" fill="none" />
    </g>

    <!-- Brazo de Tornamesa con acento Magenta Neón -->
    <circle cx="87" cy="21" r="3.8" fill="#ff6bf0" />
    <path d="M87 21 L87 51 L70 68" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="64" y="66" width="9.5" height="5.2" rx="2" transform="rotate(-42 64 66)" fill="#ff7bf2" />

    <!-- División Central Neón + Eje Spindle -->
    <line x1="50" y1="8" x2="50" y2="92" stroke="url(#divGrad)" stroke-width="1.6" stroke-dasharray="2.5 3" opacity="0.65" />
    <circle cx="50" cy="50" r="6.8" fill="#ffffff" />
    <circle cx="50" cy="50" r="3.2" fill="#07070c" />
  </g>
</svg>
