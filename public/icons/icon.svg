<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo gradiente oscuro profundo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080d" />
      <stop offset="50%" stop-color="#11071c" />
      <stop offset="100%" stop-color="#040406" />
    </linearGradient>

    <!-- Resplandor neón magenta fucsia -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7bf2" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#e024c3" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Fondo squircle premium -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="502" height="502" x="5" y="5" rx="110" fill="none" stroke="#e024c3" stroke-width="4" stroke-opacity="0.35" />

  <!-- Aura de resplandor central -->
  <circle cx="245" cy="256" r="210" fill="url(#centerGlow)" />

  <!-- Grupo del Vinilo Neón con Tonearm (ZYNKO "O") -->
  <g filter="url(#neonGlow)">
    <!-- Disco Exterior -->
    <circle cx="240" cy="260" r="185" fill="none" stroke="#ff6bf0" stroke-width="12" stroke-linecap="round" />

    <!-- Surcos concéntricos del vinilo -->
    <circle cx="240" cy="260" r="145" fill="none" stroke="#ff6bf0" stroke-width="7" stroke-linecap="round" opacity="0.85" />
    <circle cx="240" cy="260" r="105" fill="none" stroke="#ff6bf0" stroke-width="7.5" stroke-linecap="round" opacity="0.9" />
    <circle cx="240" cy="260" r="65" fill="none" stroke="#ff6bf0" stroke-width="7" opacity="0.75" />

    <!-- Centro y Agujero Spindle -->
    <circle cx="240" cy="260" r="26" fill="#ffffff" />
    <circle cx="240" cy="260" r="13" fill="#070709" />

    <!-- Brazo de Tornamesa (Tonearm) -->
    <!-- Base del brazo en cuadrante superior derecho -->
    <circle cx="400" cy="140" r="16" fill="#ff7bf2" />
    <!-- Varilla del brazo -->
    <path d="M 400 140 L 400 270 L 325 345" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Cabezal de aguja (Cartridge) -->
    <rect x="305" y="335" width="36" height="20" rx="7" transform="rotate(-40 305 335)" fill="#ff7bf2" stroke="#ffffff" stroke-width="4" />
  </g>
</svg>
