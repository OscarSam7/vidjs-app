<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040406" />
      <stop offset="50%" stop-color="#0f0728" />
      <stop offset="100%" stop-color="#040406" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo con esquinas redondeadas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#7c3aed" stroke-width="6" stroke-opacity="0.5" />

  <!-- Anillos del Vinilo de DJ -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#2e1065" stroke-width="4" stroke-opacity="0.8" />
  <circle cx="256" cy="256" r="145" fill="none" stroke="#3b0764" stroke-width="3" stroke-opacity="0.7" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#581c87" stroke-width="2.5" stroke-opacity="0.6" />

  <!-- Resplandor Neón Central -->
  <circle cx="256" cy="256" r="75" fill="url(#neonPurple)" filter="url(#glow)" opacity="0.35" />

  <!-- Logo V y Rayo de Música -->
  <path d="M 180 170 L 256 340 L 332 170" fill="none" stroke="url(#neonPurple)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <circle cx="256" cy="256" r="28" fill="#040406" stroke="url(#neonCyan)" stroke-width="8" filter="url(#glow)" />

  <!-- Rayo / Pulso Nocturno -->
  <path d="M 285 140 L 260 210 L 290 210 L 235 300 L 248 230 L 220 230 Z" fill="#facc15" filter="url(#glow)" />
</svg>
