services:
  - type: web
    name: vidjs-app
    runtime: node
    region: ohio
    plan: free
    branch: main
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: COOKIE_NAME
        value: vidjs_session
      - key: NEXT_PUBLIC_APP_NAME
        value: Vidjs Entertainment SaaS
      - key: APP_URL
        sync: false
